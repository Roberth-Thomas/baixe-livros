name: Release

# Ao criar uma tag v* (ex.: v2.0.0), gera o BaixeLivros.exe, calcula o SHA-256 e publica tudo numa Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  exe:
    name: Gerar .exe e publicar
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write        # só este job pode criar a Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Testes antes de publicar
        run: python -m pytest
      - name: Gerar o .exe
        run: python -m PyInstaller --onefile --noconsole --name BaixeLivros baixar_livro.py
      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\BaixeLivros.exe -Algorithm SHA256).Hash.ToLower()
          "$h  BaixeLivros.exe" | Out-File -Encoding ascii dist\BaixeLivros.exe.sha256
          Get-Content dist\BaixeLivros.exe.sha256
      - name: Publicar a Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$env:TAG" dist\BaixeLivros.exe dist\BaixeLivros.exe.sha256 --title "$env:TAG" --generate-notes --verify-tag
